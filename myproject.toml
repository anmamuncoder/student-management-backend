[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


# ---------------------------------------------------------------------------
# Project Metadata
# ---------------------------------------------------------------------------
[project]
name = "django-blackbox"
version = "1.0.0"
description = "A scalable Django REST Framework base project with PostgreSQL, JWT auth, versioned API routing, Celery, and OpenAPI docs. Fully containerized with Docker."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "anmamuncoder", email = "anmamuncoder@gmail.com" }]
keywords = ["django", "rest", "api", "jwt", "postgresql", "celery", "docker", "drf"]
requires-python = ">=3.12"

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]


# ---------------------------------------------------------------------------
# Core Dependencies
# ---------------------------------------------------------------------------
dependencies = [
    # Core Django
    "Django==6.0.2",
    "django-cors-headers==4.9.0",
    "django-environ==0.13.0",
    "django-filter==25.2",
    "django-jazzmin==3.0.3",
    "django-extensions==4.1",

    # Django REST Framework
    "djangorestframework==3.16.1",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.29.0",

    # Database
    "psycopg2-binary==2.9.11",
    "sqlparse==0.5.5",

    # Celery / Task Queue
    "celery==5.6.2",
    "kombu==5.6.2",
    "amqp==5.3.1",
    "billiard==4.2.4",
    "vine==5.1.0",
    "asgiref==3.11.1",

    # Caching
    "redis==7.2.1",

    # Server
    "gunicorn==25.1.0",
    "whitenoise==6.12.0",

    # Auth / JWT
    "PyJWT==2.11.0",

    # Static / Media
    "pillow==12.1.1",

    # API / Schema
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
    "uritemplate==4.2.0",
    "inflection==0.5.1",

    # Utilities
    "python-dateutil==2.9.0.post0",
    "tzdata==2025.3",
    "typing_extensions==4.15.0",
    "packaging==26.0",
]


# ---------------------------------------------------------------------------
# Optional / Extra Dependencies
# ---------------------------------------------------------------------------
[project.optional-dependencies]

dev = [
    "django-debug-toolbar==6.2.0",
    "Pygments==2.19.2",
]

test = [
    "pytest==9.0.2",
    "pytest-django==4.12.0",
    "pytest-cov==7.0.0",
    "coverage==7.13.4",
    "factory-boy==3.3.3",
    "Faker==40.5.1",
]

all = [
    "django-blackbox[dev,test]",
]


# ---------------------------------------------------------------------------
# Project URLs
# ---------------------------------------------------------------------------
[project.urls]
Homepage     = "https://anmamuncoder.vercel.app/"
Repository   = "https://github.com/anmamuncoder/django-blackbox"
"Bug Tracker" = "https://github.com/anmamuncoder/django-blackbox/issues"


# ---------------------------------------------------------------------------
# Hatch — Build Config
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["apps", "engine", "kernel", "endpoints"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/docs",
    "/staticfiles",
    "/logs",
    "db.sqlite3",
    "*.pyc",
    "__pycache__",
]


# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "engine.settings"
python_files  = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["apps"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks integration tests",
    "unit: marks unit tests",
]


# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["apps", "kernel"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "manage.py",
    "*/asgi.py",
    "*/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered  = false
fail_under    = 80


# ---------------------------------------------------------------------------
# Ruff — Linter & Formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length    = 88
exclude = [
    ".git",
    "__pycache__",
    "*/migrations/*",
    "staticfiles",
    "logs",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in default arguments
    "B904",   # allow raise without from inside except
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "engine", "kernel", "endpoints"]
known-django      = ["django"]
section-order     = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["ALL"]
"*/tests/*"      = ["S101", "S106"]


# ---------------------------------------------------------------------------
# Mypy — Static Type Checking (optional, add later)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.12"
plugins                = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores    = true
warn_return_any        = false
exclude                = ["migrations", "staticfiles"]

[[tool.mypy.overrides]]
module                 = "*.migrations.*"
ignore_errors          = true